<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320" font-family="Arial,Helvetica,sans-serif">
  <!-- ====== PANTALLA 1: SELECCIÓN DE PROGRAMA ====== -->
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1a2e"/>
      <stop offset="1" stop-color="#060d18"/>
    </linearGradient>
  </defs>
  <rect width="480" height="320" fill="url(#bg2)"/>

  <rect width="480" height="34" fill="#0e2440"/>
  <text x="14" y="23" fill="#d4af37" font-size="16" font-weight="bold">◀ PROGRAMAS</text>
  <text x="470" y="23" fill="#9fb3c8" font-size="13" text-anchor="end">elige ciclo</text>

  <!-- Programa 1 (seleccionado) -->
  <rect x="24" y="50" width="432" height="58" rx="10" fill="#14324e" stroke="#d4af37" stroke-width="2"/>
  <text x="44" y="76" fill="#e8f0f8" font-size="19" font-weight="bold">134°C · Envueltos</text>
  <text x="44" y="96" fill="#9fb3c8" font-size="13">18 min esterilización · secado 20 min</text>
  <circle cx="430" cy="79" r="11" fill="none" stroke="#d4af37" stroke-width="2"/>
  <circle cx="430" cy="79" r="6" fill="#d4af37"/>

  <!-- Programa 2 -->
  <rect x="24" y="118" width="432" height="58" rx="10" fill="#10233c" stroke="#1e3a5f"/>
  <text x="44" y="144" fill="#e8f0f8" font-size="19" font-weight="bold">121°C · Instrumental</text>
  <text x="44" y="164" fill="#9fb3c8" font-size="13">20 min esterilización · secado 15 min</text>
  <circle cx="430" cy="147" r="11" fill="none" stroke="#4a688a" stroke-width="2"/>

  <!-- Programa 3 -->
  <rect x="24" y="186" width="432" height="58" rx="10" fill="#10233c" stroke="#1e3a5f"/>
  <text x="44" y="212" fill="#e8f0f8" font-size="19" font-weight="bold">134°C · Rápido</text>
  <text x="44" y="232" fill="#9fb3c8" font-size="13">4 min esterilización · sin secado</text>
  <circle cx="430" cy="215" r="11" fill="none" stroke="#4a688a" stroke-width="2"/>

  <!-- Botón iniciar -->
  <rect x="24" y="262" width="432" height="44" rx="10" fill="#1f6b45" stroke="#4ade80"/>
  <text x="240" y="290" fill="#d9ffe9" font-size="18" font-weight="bold" text-anchor="middle">▶ INICIAR CICLO</text>
</svg>
