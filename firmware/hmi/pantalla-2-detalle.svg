<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320" font-family="Arial,Helvetica,sans-serif">
  <!-- ====== PANTALLA 2: DETALLE / TENDENCIA ====== -->
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1a2e"/>
      <stop offset="1" stop-color="#060d18"/>
    </linearGradient>
  </defs>
  <rect width="480" height="320" fill="url(#bg3)"/>

  <rect width="480" height="34" fill="#0e2440"/>
  <text x="14" y="23" fill="#d4af37" font-size="16" font-weight="bold">◀ DETALLE DE CICLO</text>
  <text x="470" y="23" fill="#4ade80" font-size="13" text-anchor="end">● en curso</text>

  <!-- Área de gráfica -->
  <rect x="24" y="48" width="432" height="170" rx="8" fill="#0a1626" stroke="#1e3a5f"/>
  <!-- ejes -->
  <line x1="54" y1="198" x2="440" y2="198" stroke="#2a4a6f"/>
  <line x1="54" y1="58" x2="54" y2="198" stroke="#2a4a6f"/>
  <!-- línea temp -->
  <polyline points="54,190 100,150 160,95 240,68 340,66 440,65" fill="none" stroke="#f0d060" stroke-width="3"/>
  <!-- línea presión -->
  <polyline points="54,185 100,170 160,140 240,120 340,118 440,118" fill="none" stroke="#4aa3ff" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="60" y="62" fill="#f0d060" font-size="11">°C</text>
  <text x="85" y="62" fill="#4aa3ff" font-size="11">bar</text>

  <!-- Fila de sensores -->
  <g font-size="13" text-anchor="middle">
    <rect x="24" y="228" width="104" height="44" rx="6" fill="#10233c" stroke="#1e3a5f"/>
    <text x="76" y="248" fill="#e8f0f8" font-size="16" font-weight="bold">94°C</text>
    <text x="76" y="265" fill="#9fb3c8" font-size="11">chaqueta</text>

    <rect x="136" y="228" width="104" height="44" rx="6" fill="#10233c" stroke="#1e3a5f"/>
    <text x="188" y="248" fill="#e8f0f8" font-size="16" font-weight="bold">98%</text>
    <text x="188" y="265" fill="#9fb3c8" font-size="11">vacío</text>

    <rect x="248" y="228" width="104" height="44" rx="6" fill="#10233c" stroke="#1e3a5f"/>
    <text x="300" y="248" fill="#4ade80" font-size="16" font-weight="bold">✓</text>
    <text x="300" y="265" fill="#9fb3c8" font-size="11">puerta</text>

    <rect x="360" y="228" width="96" height="44" rx="6" fill="#10233c" stroke="#1e3a5f"/>
    <text x="408" y="248" fill="#e8f0f8" font-size="16" font-weight="bold">4.2</text>
    <text x="408" y="265" fill="#9fb3c8" font-size="11">F0</text>
  </g>

  <!-- Eventos recientes -->
  <text x="24" y="296" fill="#9fb3c8" font-size="12">07:41 presurización OK · 07:55 inicio meseta</text>
  <rect x="24" y="302" width="432" height="16" rx="4" fill="#15304f"/>
  <text x="240" y="314" fill="#9fb3c8" font-size="12" text-anchor="middle">TOCAR PARA VOLVER</text>
</svg>
