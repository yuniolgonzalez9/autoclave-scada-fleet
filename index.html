<!DOCTYPE html>
<html lang="es" data-theme="tactical">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
    
    <title>BIOFLEET OS™ // Enterprise SCADA Biomédico</title>
    
    <!-- Configuración PWA con credenciales para evitar bloqueos de vista previa en Vercel -->
    <link rel="manifest" href="/manifest.json" crossorigin="use-credentials" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#030712" />
    <meta name="description" content="Plataforma Centralizada de Telemetría Biomédica, Trazabilidad y Supervisión de Autoclaves" />

    <!-- Iconos -->
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />

    <!-- Fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#030712] text-slate-100 min-h-screen antialiased overflow-x-hidden selection:bg-cyan-500/30 selection:text-cyan-300">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Registro protegido de Service Worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.warn('[PWA] Service Worker offline mode:', err);
          });
        });
      }
    </script>
  </body>
</html>
