<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1424" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BioFleet OS" />
    <title>Biofleet OS · SCADA</title>
    <!-- Fuentes para la interfaz biomédica -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#030712] text-white">
    <div id="root"></div>
    <script>
      // Detección temprana de despliegue: corre ANTES de cargar la app.
      // Compara el build servido con el último visto; si cambió, recarga
      // una sola vez para que ningún dispositivo quede con app vieja.
      (function () {
        try {
          fetch('/version.json?t=' + Date.now(), { cache: 'no-store' })
            .then(function (r) { return r.ok ? r.json() : null; })
            .then(function (v) {
              if (!v || !v.build) return;
              var key = 'biofleet_last_build';
              var prev = null;
              try { prev = localStorage.getItem(key); } catch (_) {}
              try { localStorage.setItem(key, v.build); } catch (_) {}
              if (prev && prev !== v.build) location.reload();
            })
            .catch(function () {});
        } catch (_) {}
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
